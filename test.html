<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Materialize Example</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Materialize CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
</head>

<script src="script.js"></script>

<body class="grey lighten-4">

  <!-- Navbar -->
  <nav class="blue">
    <div class="nav-wrapper container">
      <a href="#" class="brand-logo">My Page</a>
    </div>
  </nav>

  <div class="container" style="margin-top: 40px;">

    <!-- Buttons Section -->
    <h4>Buttons</h4>

    <a class="waves-effect waves-light btn">Default Button</a>
    <a class="waves-effect waves-light btn green">Success</a>
    <a class="waves-effect waves-light btn red">Danger</a>
    <a class="waves-effect waves-light btn-large purple">Large Button</a>

    <br><br>

    <!-- Cards Section -->
    <h4>Image Cards</h4>

    <div class="row">

      <!-- Card 1 -->
      <div class="col s12 m6 l4">
        <div class="card">
          <div class="card-image">
            <img src="https://picsum.photos/400/250?random=1">
            <span class="card-title">Card One</span>
          </div>
          <div class="card-content">
            <p>This is a sample image card using Materialize styling.</p>
          </div>
          <div class="card-action">
            <a href="#">View More</a>
          </div>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="col s12 m6 l4">
        <div class="card">
          <div class="card-image">
            <img src="https://picsum.photos/400/250?random=2">
            <span class="card-title">Card Two</span>
          </div>
          <div class="card-content">
            <p>Cards are responsive and adapt to screen size.</p>
          </div>
          <div class="card-action">
            <a href="#">Explore</a>
          </div>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="col s12 m6 l4">
        <div class="card">
          <div class="card-image">
            <img src="https://picsum.photos/400/250?random=3">
            <span class="card-title">Card Three</span>
          </div>
          <div class="card-content">
            <p>You can easily customize colors and layouts.</p>
          </div>
          <div class="card-action">
            <a href="#">Details</a>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Materialize JS (optional for interactivity) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

</body>
</html>
